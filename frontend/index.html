<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AURON · Live</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <div class="brand"><span class="mark"></span><b>AURON</b><em>live</em></div>
    <nav class="health" id="health" aria-label="System status"></nav>
    <time class="clock" id="clock">--:--:--</time>
  </header>

  <main class="grid">
    <!-- Trading: the total -->
    <section class="card hero span-8">
      <div class="label">TRADING · ALL ACCOUNTS</div>
      <div class="totals" id="totals"><div class="muted">Waiting for the first copier report…</div></div>
      <svg class="chart" id="totalChart" viewBox="0 0 800 180" preserveAspectRatio="none" aria-label="Equity over the last 24 hours"></svg>
      <div class="chart-foot"><span id="chartRange">last 24 h</span><span id="chartUpdated"></span></div>
    </section>

    <!-- Instagram -->
    <section class="card span-4 insta">
      <div class="label">INSTAGRAM</div>
      <div class="next">
        <div class="ring" id="poolRing"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" id="poolArc" cx="60" cy="60" r="52"/></svg><div><b id="poolLeft">–</b><small>in pool</small></div></div>
        <div>
          <small class="muted">Next post</small>
          <div class="countdown" id="countdown">–</div>
          <div class="muted" id="nextKind">–</div>
        </div>
      </div>
      <div class="stats" id="instaStats"></div>
      <ul class="recent" id="recent"></ul>
    </section>

    <!-- Accounts -->
    <section class="span-12 accounts" id="accounts"></section>

    <!-- Groups -->
    <section class="card span-5">
      <div class="label">PROFIT PER GROUP · TOTAL</div>
      <div class="bars" id="groups"><div class="muted">No group has traded yet.</div></div>
    </section>

    <!-- Open positions -->
    <section class="card span-7">
      <div class="label">OPEN POSITIONS <span class="count" id="openCount">0</span></div>
      <div class="table-wrap"><table class="positions" id="positions"></table></div>
      <div class="muted empty" id="noPositions">Nothing open right now.</div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
