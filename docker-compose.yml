services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jarvis_internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jarvis_internal]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jarvis}
      REDIS_URL: redis://redis:6379/0
      JARVIS_DATA_DIR: /data
      JARVIS_LOG_DIR: /logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - jarvis_data:/data
      - jarvis_logs:/logs
    ports:
      - "${JARVIS_BIND_ADDRESS:-127.0.0.1}:${JARVIS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [jarvis_internal, jarvis_shared]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PHOENIX_UI_BIND_ADDRESS:-127.0.0.1}:${PHOENIX_UI_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [jarvis_internal]

  sandbox-runner:
    build:
      context: ./runner
    restart: unless-stopped
    env_file: .env
    environment:
      JARVIS_API_URL: http://api:8000
      RUNNER_POLL_SECONDS: ${RUNNER_POLL_SECONDS:-5}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [jarvis_internal]

  n8n:
    image: n8nio/n8n:2.13.2
    container_name: n8n
    restart: unless-stopped
    environment:
      # Instagram Graph API (aus .env, nie im Repo)
      AURON_IG_ACCESS_TOKEN: ${AURON_IG_ACCESS_TOKEN}
      AURON_IG_USER_ID: ${AURON_IG_USER_ID}
      # Baseline-Werte des urspruenglichen docker-run-Containers
      N8N_RUNNERS_HEARTBEAT_INTERVAL: "120"
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: "2048"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Neu: verhindert das erneute Zuwachsen der SQLite-DB
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      N8N_LOG_LEVEL: warn
    volumes:
      - n8n_data:/home/node/.n8n
      - "C:/JARVIS_Images:/data/images"
    ports:
      - "5678:5678"
    mem_limit: 3g
    # Das Default-Netz 'bridge' laesst sich hier nicht eintragen: Compose setzt
    # immer einen Netzwerk-Alias, den nur user-defined Netze zulassen.
    # Nach 'compose up' daher zusaetzlich:  docker network connect bridge n8n
    networks: [jarvis_shared]

volumes:
  postgres_data:
  redis_data:
  jarvis_data:
  jarvis_logs:
  n8n_data:
    external: true

networks:
  jarvis_internal:
    driver: bridge
  jarvis_shared:
    external: true
    name: ${JARVIS_SHARED_NETWORK:-jarvis_shared}

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
